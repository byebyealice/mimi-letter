<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="让你的 AI，托黑猫邮差米米给你送一封信。">
<meta property="og:title" content="米米的银河邮局">
<meta property="og:description" content="让你的 AI，托黑猫邮差米米给你送一封信。">
<meta property="og:image" content="https://byebyealice.github.io/mimi-letter/docs/banner.jpg">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; height: 100%; }
body { margin: 0; font: 14px system-ui, -apple-system, sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>米米的信</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&family=ZCOOL+XiaoWei&display=swap">
<style>
/* Layout: one 9:16 night-sky stage, centred; every scene (fly-in, hand-over, envelope, letter) lives inside it. Single dark look by choice. */
:root {
  color-scheme: dark;
  --night: #15123a;      /* page ground around the stage */
  --sky: #2a2370;        /* stage fallback before the sky image loads */
  --gold: #f4c95d;       /* light, stars, hints */
  --cream: #f6efdf;      /* envelope paper */
  --ink: #3b2f4a;        /* default letter ink */
  --hint: #fff6df;
  --font-ui: "ZCOOL KuaiLe", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-letter: "ZCOOL XiaoWei", "Songti SC", "STSong", "Noto Serif SC", serif;
  --font-sign: "Ma Shan Zheng", "Kaiti SC", "STKaiti", "KaiTi", cursive;
  --wax: #b3202a;
  --paper: #f6efdf;
  --paper-img: url("img/paper1.webp");
  --paper-ink: #3b2f4a;
  --paper-line: rgba(59, 47, 74, .12);
}
html, body { height: 100%; }
body {
  background: var(--night); color: var(--hint);
  display: grid; place-items: center; overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  box-sizing: border-box;
  font-family: var(--font-ui);
}
#stage {
  position: relative; overflow: hidden;
  height: 100%; max-height: 100%; aspect-ratio: 9 / 16; max-width: 100%;
  border-radius: 22px;
  background: var(--sky) url("img/sky.webp") center / cover no-repeat;
  box-shadow: 0 30px 80px rgba(0,0,0,.45);
  container-type: inline-size;
  user-select: none; -webkit-user-select: none;
  cursor: pointer;
}
@media (max-aspect-ratio: 9/16) { #stage { height: auto; width: 100%; } }

/* ambient twinkles */
.twinkle { position: absolute; width: 1.2cqw; height: 1.2cqw; border-radius: 50%;
  background: radial-gradient(circle, #fff 0 30%, rgba(255,230,160,.0) 70%);
  animation: tw 3.2s ease-in-out infinite; pointer-events: none; }
@keyframes tw { 0%,100% { opacity: .15; transform: scale(.6); } 50% { opacity: 1; transform: scale(1.2); } }

#dust { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

/* scene sprites */
.sprite { position: absolute; pointer-events: none; will-change: transform, opacity; }
#clouds { position: absolute; left: 0; right: 0; bottom: 0; height: 40%; pointer-events: none;
  background: url("img/clouds.webp") 0 0 / auto 100% repeat-x; will-change: background-position; }
#mimi { width: 84%; left: 8%; top: 37%; opacity: 0; }
#mimi.bye { width: 130%; left: -15%; top: 22%; transform-origin: 45% 55%; }
.keep { position: absolute; left: 16%; right: 16%; bottom: 5%; padding: 0; border: 0; background: none; cursor: pointer;
  opacity: 0; pointer-events: none; transition: opacity .4s; }
.keep img { width: 100%; display: block; filter: drop-shadow(0 0 1.6cqw rgba(255,236,190,.35)) drop-shadow(0 .6cqw .8cqw rgba(10,5,40,.6)); }
.keep.on { opacity: 1; pointer-events: auto; animation: tipBob 2.4s ease-in-out infinite; }
.keep:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; border-radius: 3cqw; }
.bye-note { position: absolute; left: 0; right: 0; top: 34%; text-align: center; font-family: var(--font-ui); font-size: 5.6cqw; line-height: 1.6;
  letter-spacing: .08em; color: var(--hint); text-shadow: 0 0 3cqw rgba(255,214,120,.5), 0 .5cqw 1cqw rgba(10,5,40,.8); opacity: 0; pointer-events: none; transition: opacity .8s; }
.bye-note small { display: block; font-size: 3.6cqw; opacity: .75; }
.bye-note.on { opacity: 1; }
.shoot { position: absolute; width: 22%; height: 2px; border-radius: 2px; pointer-events: none;
  background: linear-gradient(90deg, rgba(255,243,196,0), #fff3c4 70%, #fff);
  transform: rotate(-24deg); opacity: 0; }
.shoot.go { animation: shoot 1.1s ease-out forwards; }
@keyframes shoot { 0% { opacity: 0; translate: 0 0; } 15% { opacity: 1; } 100% { opacity: 0; translate: -70cqw 32cqw; } }

.hint {
  position: absolute; left: 0; right: 0; text-align: center;
  font-size: 4.6cqw; letter-spacing: .08em; color: var(--hint);
  text-shadow: 0 2px 12px rgba(20,10,60,.8);
  opacity: 0; transition: opacity .5s; pointer-events: none;
}
.hint.on { opacity: 1; animation: breathe 2.4s ease-in-out infinite; }
@keyframes breathe { 0%,100% { opacity: .65; } 50% { opacity: 1; } }
#hint2 { top: auto; bottom: 5%; left: 10%; right: 10%; padding: 0; }
#hint2 img { width: 100%; display: block; filter: drop-shadow(0 0 1.6cqw rgba(255,236,190,.35)) drop-shadow(0 .6cqw .8cqw rgba(10,5,40,.6)); }
#hint2.on { animation: tipBob 2.4s ease-in-out infinite; }
@keyframes tipBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6%); } }
/* brand title: the painted logo drops in, bounces, then floats */
.title { position: absolute; left: 4%; right: 4%; top: 6%; pointer-events: none; opacity: 0; }
.title img { width: 100%; display: block; filter: drop-shadow(0 0 3cqw rgba(255,214,120,.35)); }
.title.on { animation: logoIn .9s cubic-bezier(.3,1.5,.5,1) forwards, logoFloat 3.2s ease-in-out .9s infinite; }
.title.off { animation: logoOut .6s ease-in forwards; }
@keyframes logoIn { from { opacity: 0; transform: translateY(-40%) scale(.7) rotate(-4deg); } to { opacity: 1; transform: none; } }
@keyframes logoFloat { 0%,100% { opacity: 1; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-3%); } }
@keyframes logoOut { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(-20%) scale(.92); } }

/* tap hint: Mimi's own black paw presses the thing to tap */
#paw { position: absolute; width: 20%; aspect-ratio: 1; pointer-events: none; opacity: 0; transition: opacity .35s; z-index: 6; }
#paw.on { opacity: 1; }
#paw .hand { width: 100%; height: 100%; transform-origin: 50% 50%; animation: tap 1.3s ease-in-out infinite; }
#paw img { width: 100%; height: 100%; display: block; filter: drop-shadow(0 1cqw 1.4cqw rgba(10,5,40,.6)); }
#paw .ripple { position: absolute; left: 50%; top: 50%; width: 90%; aspect-ratio: 1; border-radius: 50%;
  border: .7cqw solid #fff3d6; translate: -50% -50%; opacity: 0; animation: ripple 1.3s ease-out infinite; }
@keyframes tap {
  0%, 100% { transform: translate(28%, 24%) rotate(-14deg) scale(1.08); }
  40% { transform: translate(0, 0) rotate(-14deg); }
  50% { transform: translate(0, 2%) rotate(-14deg) scale(1.06, .86); }
  62% { transform: translate(0, 0) rotate(-14deg); }
}
@keyframes ripple { 0%, 42% { opacity: 0; transform: scale(.2); } 50% { opacity: .95; } 85%, 100% { opacity: 0; transform: scale(1.5); } }
/* envelope: two painted states, closed and open, aligned on the same pocket */
#env {
  position: absolute; left: 14%; width: 72%; aspect-ratio: 1089 / 650; top: 42%;
  opacity: 0; transform: scale(.35) translateY(40%);
  filter: drop-shadow(0 2cqw 4cqw rgba(10,5,40,.45));
}
#env > img { position: absolute; left: 0; width: 100%; display: block; pointer-events: none; }
#env-closed { position: absolute; inset: 0; }
#env-closed > img { position: absolute; left: 0; bottom: 0; width: 100%; display: block; }
.env-stamp { position: absolute; right: 5%; top: 7%; width: 15%; background: #fffaf0; padding: 1.2%;
  -webkit-mask: radial-gradient(.7cqw at .7cqw .7cqw, #0000 97%, #000) round -.7cqw -.7cqw / 1.6cqw 1.6cqw, linear-gradient(#000 0 0) content-box;
          mask: radial-gradient(.7cqw at .7cqw .7cqw, #0000 97%, #000) round -.7cqw -.7cqw / 1.6cqw 1.6cqw, linear-gradient(#000 0 0) content-box;
  transform: rotate(5deg); filter: drop-shadow(0 .3cqw .5cqw rgba(0,0,0,.2)); }
.env-stamp img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
.env-pm { position: absolute; right: 11%; top: 9%; width: 36%; color: #3b2f4a; opacity: .5; transform: rotate(-12deg); pointer-events: none; }
.env-stars { position: absolute; left: 5%; top: 5%; width: 24%; }
.env-to { position: absolute; left: 8%; bottom: 9%; font-family: var(--font-sign); font-size: 5cqw; color: #4a3b2a; transform: rotate(-3deg); max-width: 34%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#env-open { bottom: 0; opacity: 0; }
#seal { position: absolute; width: 22%; left: 39%; top: 53.9%; aspect-ratio: 1; z-index: 4; cursor: pointer; border-radius: 50%; }
#seal:focus { outline: none; }
#seal:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }
#seal img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; transition: transform .6s ease-out, opacity .6s ease-out; }
#seal .l { clip-path: polygon(0 0, 54% 0, 44% 30%, 56% 52%, 42% 74%, 52% 100%, 0 100%); }
#seal .r { clip-path: polygon(54% 0, 100% 0, 100% 100%, 52% 100%, 42% 74%, 56% 52%, 44% 30%); }
#env.open #seal .l { transform: translate(-45%, 35%) rotate(-35deg); opacity: 0; }
#env.open #seal .r { transform: translate(45%, 35%) rotate(30deg); opacity: 0; }

/* letter: painted deckle-edged paper */
#letter {
  position: absolute; left: 6%; width: 88%; top: 5%; aspect-ratio: 720 / 1040;
  background: var(--paper-img) center / 100% 100% no-repeat; color: var(--paper-ink);
  filter: drop-shadow(0 2.5cqw 5cqw rgba(8,4,40,.5));
  padding: 11cqw 10cqw 9cqw;
  box-sizing: border-box;
  display: flex; flex-direction: column; gap: 2.5cqw;
  opacity: 0; transform: translateY(18%) scale(.6);
  cursor: default; overflow: hidden;
}
.l-head { display: flex; justify-content: space-between; align-items: flex-start; min-height: 22cqw; position: relative; }
.l-to { font-family: var(--font-sign); font-size: 6.4cqw; padding-top: 7cqw; min-width: 0; overflow-wrap: anywhere; }
.stamp-wrap { position: relative; width: 21cqw; flex: none; }
.stamp {
  --r: 1.1cqw; --s: 2.6cqw;
  background: #fffaf0; padding: 2.4cqw;
  -webkit-mask: radial-gradient(var(--r) at var(--r) var(--r), #0000 97%, #000) round calc(-1 * var(--r)) calc(-1 * var(--r)) / var(--s) var(--s), linear-gradient(#000 0 0) content-box;
          mask: radial-gradient(var(--r) at var(--r) var(--r), #0000 97%, #000) round calc(-1 * var(--r)) calc(-1 * var(--r)) / var(--s) var(--s), linear-gradient(#000 0 0) content-box;
  transform: rotate(4deg);
  filter: drop-shadow(0 .5cqw .8cqw rgba(0,0,0,.18));
}
.stamp img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
.postmark { position: absolute; width: 28cqw; left: -17cqw; top: 8cqw; color: var(--paper-ink); opacity: .5; transform: rotate(-14deg); pointer-events: none; }
.l-body { font-family: var(--font-letter); font-size: 4.8cqw; line-height: 7.4cqw; white-space: pre-wrap; overflow-wrap: anywhere; flex: 1; min-height: 0; overflow-y: auto; }
.l-body span { opacity: 0; transition: opacity .35s; }
.l-body span.on { opacity: 1; }
.l-foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 3cqw; }
.gift { display: grid; gap: 1cqw; justify-items: center; width: 30cqw; flex: none; }
.gift[hidden] { display: none !important; }
.gift-note { font-family: var(--font-letter); font-size: 2.9cqw; line-height: 1.45; text-align: center; opacity: .72; white-space: pre-line; }
.parcel { width: 20cqw; animation: float 3s ease-in-out infinite; }
.parcel svg { width: 100%; display: block; overflow: visible; }
@keyframes float { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-1.6cqw) rotate(3deg); } }
.doodle { position: absolute; right: 9cqw; bottom: 27cqw; width: 18cqw; transform: rotate(-8deg); opacity: 0;
  filter: drop-shadow(0 .6cqw .8cqw rgba(40,20,60,.28)); pointer-events: none; }
.doodle canvas { width: 100%; display: block; image-rendering: pixelated; }
.pix-wrap { display: grid; grid-template-columns: auto 1fr; gap: 3cqw; align-items: start; }
#pix { width: 44cqw; aspect-ratio: 1; image-rendering: pixelated; background: #fffaf0; border-radius: 1.5cqw; touch-action: none; cursor: crosshair; }
.palette { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1.4cqw; }
.sw { aspect-ratio: 1; border-radius: 50%; border: 2px solid rgba(255,246,223,.25); cursor: pointer; padding: 0; }
.sw[aria-checked="true"] { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold); }
.sw.erase { background: repeating-conic-gradient(#ddd 0 25%, #fff 0 50%) 50% / 40% 40%; }
.pix-tools { display: grid; gap: 2cqw; }
.l-from { font-family: var(--font-sign); font-size: 6.4cqw; text-align: right; min-width: 0; overflow-wrap: anywhere; }
.l-from small { display: block; font-family: var(--font-letter); font-size: 3.2cqw; opacity: .6; letter-spacing: .1em; }

/* end controls */
#controls { position: absolute; left: 0; right: 0; bottom: 3.2%; display: flex; justify-content: center; gap: 3cqw; opacity: 0; pointer-events: none; transition: opacity .5s; }
#controls.on { opacity: 1; pointer-events: auto; }
.save-mini { position: absolute; top: 1.2%; right: 4%; z-index: 7; font-family: var(--font-ui); font-size: 3.4cqw; letter-spacing: .06em;
  color: #2a1d55; background: var(--gold); border: 0; border-radius: 99px; padding: 1.2cqw 3.6cqw; cursor: pointer;
  box-shadow: 0 .8cqw 2cqw rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .4s; }
.save-mini.on { opacity: 1; pointer-events: auto; }
#saved { position: absolute; inset: 0; z-index: 20; background: rgba(12,9,38,.88); display: grid; place-items: center; align-content: center; gap: 3cqw;
  padding: 5cqw; box-sizing: border-box; cursor: default; }
#saved img { max-width: 88%; max-height: 74%; border-radius: 2cqw; box-shadow: 0 2cqw 6cqw rgba(0,0,0,.5); -webkit-touch-callout: default; user-select: auto; -webkit-user-select: auto; }
#saved p { margin: 0; font-family: var(--font-ui); font-size: 3.6cqw; color: var(--hint); opacity: .8; text-align: center; }
#saved .row2 { display: flex; gap: 3cqw; }
#saved .spin { font-family: var(--font-ui); font-size: 4.4cqw; color: var(--hint); }
.btn {
  font-family: var(--font-ui); font-size: 4cqw; letter-spacing: .06em;
  color: #2a1d55; background: var(--gold); border: 0; border-radius: 99px;
  padding: 2cqw 5cqw; cursor: pointer; box-shadow: 0 1cqw 3cqw rgba(0,0,0,.3);
}
.btn.ghost { background: rgba(255,246,223,.16); color: var(--hint); box-shadow: inset 0 0 0 1px rgba(255,246,223,.5); }
.btn:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* composer sheet */
#sheet {
  position: absolute; inset: auto 0 0 0; max-height: 88%;
  background: #1d1850; color: var(--hint);
  border-radius: 5cqw 5cqw 0 0; padding: 5cqw 5cqw 6cqw; box-sizing: border-box;
  transform: translateY(105%); transition: transform .45s cubic-bezier(.2,.8,.2,1);
  overflow-y: auto; cursor: default; display: grid; gap: 3cqw;
  box-shadow: 0 -2cqw 8cqw rgba(0,0,0,.5);
  font-size: 3.6cqw;
}
#sheet.on { transform: translateY(0); }
#sheet h2 { margin: 0; font-weight: 400; font-size: 5.4cqw; letter-spacing: .08em; color: var(--gold); }
#sheet p { margin: 0; line-height: 1.6; opacity: .8; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 3cqw; }
.field { display: grid; gap: 1.2cqw; min-width: 0; }
.field label { font-size: 3.2cqw; opacity: .75; letter-spacing: .06em; }
.field input, .field select, .field textarea {
  font: inherit; font-family: var(--font-letter); font-size: 3.8cqw;
  background: #2a2468; color: #fff6df; border: 1px solid rgba(255,246,223,.25);
  border-radius: 2cqw; padding: 2cqw 2.4cqw; min-width: 0; box-sizing: border-box; width: 100%;
}
.field textarea { min-height: 26cqw; resize: vertical; line-height: 1.6; }
.marker { font-family: ui-monospace, Menlo, monospace; font-size: 2.8cqw; line-height: 1.5; background: #120f33; border-radius: 2cqw; padding: 2.4cqw; overflow-wrap: anywhere; user-select: all; -webkit-user-select: all; }
.sheet-actions { display: flex; gap: 3cqw; flex-wrap: wrap; }
.count { font-size: 3cqw; opacity: .6; text-align: right; }
.sr { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(12cqw, 1fr)); gap: 1.6cqw; }
.chip { font: inherit; font-size: 2.7cqw; color: var(--hint); background: #2a2468; border: 1px solid rgba(255,246,223,.18);
  border-radius: 2cqw; padding: 1.4cqw 1cqw 1.2cqw; display: grid; gap: 1cqw; justify-items: center; cursor: pointer; min-width: 0; }
.chip[aria-checked="true"] { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); background: #352e7c; }
.chip .pic { width: 100%; aspect-ratio: 1; display: grid; place-items: center; }
.chip .pic img, .chip .pic svg { max-width: 100%; max-height: 100%; display: block; }
.chip .pic.paper img { width: 66%; height: auto; }
.chip .pic.stp img { width: 84%; border: .9cqw solid #fffaf0; box-sizing: border-box; }
.chip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

@media (prefers-reduced-motion: reduce) {
  .parcel, .twinkle, .hint.on, .shoot, #paw .hand, #paw .ripple { animation: none !important; }
  .title.on { animation: none !important; opacity: 1 !important; }
}
</style>
</head>
<body>


<div id="stage" role="main" aria-label="米米的信">
  <canvas id="dust"></canvas>
  <div id="clouds"></div>
  <div class="shoot" id="shoot"></div>
  <img id="mimi" class="sprite" src="img/ride/00.webp" alt="米米骑着红色小摩托送信来了">
  <div id="hint1" class="title"><img src="img/logo.webp" alt="米米的银河邮局 Mimi Galaxy Post Office"></div>
  <div id="hint2" class="hint"><img id="tip-img" src="img/tip1.webp" alt="点一下，收下这封信"></div>

  <div id="paw" aria-hidden="true"><div class="hand"><img src="img/paw.webp" alt=""></div><span class="ripple"></span></div>
  <div id="env" aria-label="信封">
    <div id="env-closed">
      <img src="img/env-closed.webp" alt="">
      <div class="env-stamp"><img id="env-stamp-img" src="img/stamp1.webp" alt=""></div>
      <svg class="env-pm" viewBox="0 0 120 80" aria-hidden="true">
          <path d="M18 47 C18 36 22 30 25 27 L21 5 L36 19 C38.5 18.4 41.5 18.4 44 19 L59 5 L55 27 C58 30 62 36 62 47 C62 60 52 68 40 68 C28 68 18 60 18 47 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <path d="M24 47 C24 37 29 31 33 29 C37 27 43 27 47 29 C51 31 56 37 56 47 C56 57 49 63 40 63 C31 63 24 57 24 47 Z" fill="none" stroke="currentColor" stroke-width="1"/>
          <path d="M37.5 22.5 l1.2 -2.4 l1.3 2.4 l2.6 .3 l-1.9 1.8 l.5 2.6 l-2.5 -1.3 l-2.4 1.3 l.5 -2.6 l-1.9 -1.8 z" fill="currentColor"/>
          <text x="40" y="45" text-anchor="middle" font-size="8.4" fill="currentColor" font-family="Georgia, serif" font-weight="700" letter-spacing=".4">MGPO</text>
          <text class="pm-date" x="40" y="54" text-anchor="middle" font-size="4.8" fill="currentColor" font-family="Georgia, serif">2026.11.11</text>
          <path d="M11 44 h7 M11 49 h7 M62 44 h7 M62 49 h7" stroke="currentColor" stroke-width=".9" stroke-linecap="round"/>
          <path d="M72 32q6-4 12 0t12 0t12 0t10 0M72 41q6-4 12 0t12 0t12 0t10 0M72 50q6-4 12 0t12 0t12 0t10 0" fill="none" stroke="currentColor" stroke-width="1.4"/>
        </svg>
      <svg class="env-stars" viewBox="0 0 100 40" aria-hidden="true"><path d="M12 6l2.6 5.4 5.9.9-4.3 4.1 1 5.9-5.2-2.8-5.3 2.8 1-5.9-4.3-4.1 6-.9z" fill="#f4c95d" stroke="#c9922a" stroke-width="1"/><path d="M34 22l1.6 3.3 3.6.5-2.6 2.5.6 3.6-3.2-1.7-3.2 1.7.6-3.6-2.6-2.5 3.6-.5z" fill="#f4c95d" stroke="#c9922a" stroke-width=".8"/></svg>
      <div class="env-to" id="env-to">To：Alice</div>
    </div>
    <img id="env-open" src="img/env-open.webp" alt="">

<script>
(() => {
  const PAPERS = {

  const PARCELS = { 0: "不带包裹", 1: "发光的月牙", 2: "星星包裹", 3: "泡泡月亮", 4: "笑脸小行星" };

  const PARCEL_SVG = {

      <path d="M62 12a38 38 0 1 0 22 62a30 30 0 1 1 -22 -62z" fill="#ffd36b" opacity=".6" filter="url(#glow1)"/>
      <path d="M62 12a38 38 0 1 0 22 62a30 30 0 1 1 -22 -62z" fill="url(#pg1)"/>
      <circle cx="40" cy="40" r="3" fill="#e0a52c" opacity=".5"/><circle cx="34" cy="62" r="4" fill="#e0a52c" opacity=".4"/>
      <path d="M22 50h40" stroke="#c9922a" stroke-width="5" stroke-linecap="round"/>
      <path d="M42 50c-8-10-18-8-14 0s10 4 14 0zm0 0c8-10 18-8 14 0s-10 4-14 0z" fill="#f4c95d" stroke="#c9922a" stroke-width="2"/>
      <path d="M42 50l-3 22m3-22l5 22" stroke="#c9922a" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M44 74l2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.6-4.8 2.6.9-5.4-3.9-3.8 5.4-.8z" fill="#ffe08a" stroke="#c9922a" stroke-width="1"/></svg>`,
    2: `<svg viewBox="0 0 100 100"><defs><filter id="glow2"><feGaussianBlur stdDeviation="5"/></filter></defs>
      <rect x="18" y="30" width="64" height="56" rx="6" fill="#ffe8a6" opacity=".5" filter="url(#glow2)"/>
      <rect x="18" y="34" width="64" height="52" rx="6" fill="#f6e3b8" stroke="#c9922a" stroke-width="2"/>
      <rect x="14" y="26" width="72" height="14" rx="4" fill="#efd398" stroke="#c9922a" stroke-width="2"/>
      <rect x="45" y="26" width="10" height="60" fill="#f4c95d" stroke="#c9922a" stroke-width="1.5"/>
      <path d="M50 26c-10-14-24-10-18-2s14 4 18 2zm0 0c10-14 24-10 18-2s-14 4-18 2z" fill="#f4c95d" stroke="#c9922a" stroke-width="2"/>
      <path d="M35 62a9 9 0 1 0 9 -12a7 7 0 1 1 -9 12z" fill="#ffd36b" stroke="#c9922a" stroke-width="1.2"/></svg>`,
    3: `<svg viewBox="0 0 100 100"><defs><radialGradient id="pg3" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".25" stop-color="#fff" stop-opacity=".15"/><stop offset="1" stop-color="#cbbdf5" stop-opacity=".35"/></radialGradient></defs>
      <path d="M50 18c-10-12-24-8-18 0s14 2 18 0zm0 0c10-12 24-8 18 0s-14 2-18 0z" fill="#f4c95d" stroke="#c9922a" stroke-width="2"/>
      <path d="M50 18v8" stroke="#c9922a" stroke-width="2"/>
      <circle cx="50" cy="60" r="34" fill="url(#pg3)" stroke="#fff" stroke-opacity=".7" stroke-width="1.5"/>
      <path d="M58 44a16 16 0 1 0 10 26a13 13 0 1 1 -10 -26z" fill="#ffd36b"/>
      <ellipse cx="38" cy="44" rx="7" ry="4" fill="#fff" opacity=".7" transform="rotate(-30 38 44)"/></svg>`,
    4: `<svg viewBox="0 0 100 100"><defs><radialGradient id="pg4" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ffd0e0"/><stop offset="1" stop-color="#e58fb4"/></radialGradient></defs>
      <ellipse cx="50" cy="56" rx="46" ry="11" fill="none" stroke="#f4c95d" stroke-width="4" transform="rotate(-12 50 56)"/>
      <circle cx="50" cy="52" r="28" fill="url(#pg4)"/>
      <path d="M8 60a46 11 -12 0 0 84 -18" fill="none" stroke="#f4c95d" stroke-width="4" transform="rotate(-12 50 56)" opacity="0"/>
      <path d="M22 66q28 12 56 -10" fill="none" stroke="#f4c95d" stroke-width="4" stroke-linecap="round"/>
      <circle cx="41" cy="48" r="3" fill="#4a2a3a"/><circle cx="59" cy="48" r="3" fill="#4a2a3a"/>
      <path d="M43 56q7 7 14 0" fill="none" stroke="#4a2a3a" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="35" cy="55" r="3.5" fill="#ff7aa5" opacity=".6"/><circle cx="65" cy="55" r="3.5" fill="#ff7aa5" opacity=".6"/></svg>`,
  };

  const DEMO = "[米米的信|信纸1|火漆1|邮票2|包裹1|To:Alice|From:东君|画:0000000000000000/0800005555000080/0880055225500880/0848552222558480/0888555225558880/0888555555558880/0888222222228880/0888888888888880/0882788888872880/0882288888822880/0888888888888880/0888888448888880/0088888888888800/0033333333333300/0003333223333000/0000000000000000|信:这是米米送出的第一封信。它路上绕了两圈银河，信封有一点皱，你别嫌弃。今天你看着我去找画师、写任务单、一张一张验货，GPT闷头画了三张，我一张一张记在账上。这一封不记账，是送你的。]";

  const $ = (id) => document.getElementById(id);
  const stage = $("stage"), mimi = $("mimi"), env = $("env"), seal = $("seal"), letter = $("letter");
  const hint1 = $("hint1"), hint2 = $("hint2"), controls = $("controls"), sheet = $("sheet");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  function clean(s, n) { return String(s || "").replace(/[\[\]|]/g, "").trim().slice(0, n); }

  function parse(raw) {
    let s = String(raw || "").trim();
    try { s = decodeURIComponent(s); } catch (e) {}
    s = s.replace(/^#/, "").trim();
    if (!s.startsWith("[") || !s.endsWith("]")) return null;
    s = s.slice(1, -1);
    const parts = s.split("|");
    if (!/^米米的信/.test(parts[0] || "")) return null;
    const out = { paper: 1, wax: 1, stamp: 1, parcel: 0, to: "你", from: "送信给你的我", body: "", draw: "" };
    for (let i = 1; i < parts.length; i++) {
      const p = parts[i].trim();
      let m;
      if (p.startsWith("信:") || p.startsWith("信：")) { out.body = parts.slice(i).join("").slice(2); break; }
      if ((m = p.match(/^信纸\s*(\d)/))) out.paper = PAPERS[m[1]] ? +m[1] : 1;
      else if ((m = p.match(/^火漆\s*(\d)/))) out.wax = WAXES[m[1]] ? +m[1] : 1;
      else if ((m = p.match(/^邮票\s*(\d)/))) out.stamp = STAMPS[m[1]] ? +m[1] : 1;
      else if ((m = p.match(/^包裹\s*(\d)/))) out.parcel = PARCELS[m[1]] !== undefined ? +m[1] : 0;
      else if ((m = p.match(/^To\s*[:：](.*)$/i))) out.to = clean(m[1], 20) || out.to;
      else if ((m = p.match(/^From\s*[:：](.*)$/i))) out.from = clean(m[1], 20) || out.from;
      else if ((m = p.match(/^画\s*[:：](.*)$/))) out.draw = normDraw(m[1]);
    }
    out.body = clean(out.body, 300);
    return out;
  }

  function normDraw(raw) {
    const rows = String(raw).split(/[\/,，、\s]+/).map(r => r.replace(/[^0-9]/g, "")).filter(r => r.length).slice(0, 16)
      .map(r => (r + "0".repeat(16)).slice(0, 16));
    while (rows.length && rows.length < 16) rows.push("0".repeat(16));
    return rows.some(r => /[1-9]/.test(r)) ? rows.join("/") : "";
  }
  function build(d) {
    const pic = d.draw ? `|画:${d.draw}` : "";
    return `[米米的信|信纸${d.paper}|火漆${d.wax}|邮票${d.stamp}|包裹${d.parcel}|To:${clean(d.to,20)}|From:${clean(d.from,20)}${pic}|信:${clean(d.body,300)}]`;
  }
  const PIX = { 1: "#2b2440", 2: "#f4c95d", 3: "#d9433f", 4: "#f2a0b8", 5: "#3a3f9a", 6: "#6cbf7a", 7: "#fffaf0", 8: "#1e1a26", 9: "#f39a4b" };
  function drawSticker(cv, draw) {
    const g = cv.getContext("2d"), rows = draw ? draw.split("/") : [], cell = cv.width / 18;
    g.clearRect(0, 0, cv.width, cv.height);
    const on = (x, y) => rows[y] && rows[y][x] && rows[y][x] !== "0";
    g.fillStyle = "#fffaf0";
    for (let y = -1; y <= 16; y++) for (let x = -1; x <= 16; x++) {
      let near = false;
      for (let dy = -1; dy <= 1 && !near; dy++) for (let dx = -1; dx <= 1; dx++) if (on(x + dx, y + dy)) { near = true; break; }
      if (near) g.fillRect((x + 1) * cell, (y + 1) * cell, cell + .5, cell + .5);
    }
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) if (on(x, y)) { g.fillStyle = PIX[rows[y][x]]; g.fillRect((x + 1) * cell, (y + 1) * cell, cell + .5, cell + .5); }
  }

  // ---------- twinkles ----------
  for (let i = 0; i < 14; i++) {
    const t = document.createElement("div");
    t.className = "twinkle";
    t.style.left = (Math.random() * 96 + 2) + "%";
    t.style.top = (Math.random() * 45 + 2) + "%";
    t.style.animationDelay = (Math.random() * 3).toFixed(2) + "s";
    stage.insertBefore(t, stage.firstChild);
  }

  // ---------- moving world: clouds scroll, star streaks, shooting stars ----------
  const cv = $("dust"), cx = cv.getContext("2d"), clouds = $("clouds");
  let streaks = [], speed = 0, target = 0, cloudX = 0, last = 0;
  function sizeCanvas() { const r = stage.getBoundingClientRect(); cv.width = r.width * devicePixelRatio; cv.height = r.height * devicePixelRatio; }
  addEventListener("resize", sizeCanvas); sizeCanvas();
  function frame(t) {
    const dt = Math.min(50, t - (last || t)); last = t;
    speed += (target - speed) * Math.min(1, dt / 420);
    const w = stage.clientWidth;
    cloudX -= speed * w * 0.0009 * dt;
    clouds.style.backgroundPositionX = cloudX.toFixed(1) + "px";
    cx.clearRect(0, 0, cv.width, cv.height);
    if (speed > 0.25 && Math.random() < speed * 0.6) {
      streaks.push({ x: cv.width + 10, y: Math.random() * cv.height * 0.85, len: (20 + Math.random() * 60) * devicePixelRatio, a: .25 + Math.random() * .5, k: .6 + Math.random() * .9 });
    }
    cx.lineCap = "round";
    for (const p of streaks) {
      p.x -= speed * p.k * w * 0.0026 * dt * devicePixelRatio;
      const len = p.len * Math.max(.08, speed);
      cx.strokeStyle = `rgba(255,243,196,${(p.a * Math.min(1, speed * 1.6 + .15)).toFixed(3)})`;
      cx.lineWidth = 1.6 * devicePixelRatio;
      cx.beginPath(); cx.moveTo(p.x, p.y); cx.lineTo(p.x + len, p.y); cx.stroke();
    }
    streaks = streaks.filter(p => p.x > -p.len && (speed > 0.02 || Math.random() > .02));
    requestAnimationFrame(frame);
  }
  if (!reduce) requestAnimationFrame(frame);
  function shootingStar() {
    const el = $("shoot");
    el.classList.remove("go"); void el.offsetWidth;
    el.style.left = (55 + Math.random() * 35) + "%"; el.style.top = (4 + Math.random() * 22) + "%";
    el.classList.add("go");
  }
  if (!reduce) setInterval(() => { if (Math.random() < .6) shootingStar(); }, 4200);

  // ---------- sprite player for the GIF frames ----------
  const FRAMES = { ride: 12, stop: 12, bye: 73 };
  const cache = {};
  const loadSet = (k) => { cache[k] = Array.from({ length: FRAMES[k] }, (_, i) => { const im = new Image(); im.src = `img/${k}/${String(i).padStart(2, "0")}.webp`; return im; }); };
  loadSet("ride"); loadSet("stop");
  const ready = Promise.race([
    Promise.all([...cache.ride, ...cache.stop].map(im => im.decode().catch(() => {}))),
    new Promise(r => setTimeout(r, 4000)),
  ]);
  let spriteTimer = 0;
  function stopSprite() { clearInterval(spriteTimer); spriteTimer = 0; }
  function show(k, i) { mimi.src = cache[k][i].src; }
  function loop(k, ms) { stopSprite(); let i = 0; show(k, 0); spriteTimer = setInterval(() => { i = (i + 1) % FRAMES[k]; show(k, i); }, ms); }
  function once(k, ms) {
    stopSprite();
    return new Promise(res => { let i = 0; show(k, 0); spriteTimer = setInterval(() => { i++; if (i >= FRAMES[k]) { stopSprite(); res(); return; } show(k, i); }, reduce ? 1 : ms); });
  }

  // ---------- paw pointer ----------
  const paw = $("paw");
  function pawAt(x, y) { paw.style.left = (x - 10) + "%"; paw.style.top = (y - 5.6) + "%"; paw.classList.add("on"); }
  function pawOff() { paw.classList.remove("on"); }

  // ---------- helpers ----------
  let run = 0;
  const sleep = (ms) => new Promise(r => setTimeout(r, reduce ? Math.min(ms, 60) : ms));
  const anim = (el, kf, opt) => el.animate(kf, Object.assign({ fill: "forwards", easing: "cubic-bezier(.2,.8,.2,1)" }, opt, reduce ? { duration: 1 } : {})).finished.catch(() => {});
  function waitTap(target) {
    return new Promise(res => {
      const go = (e) => { if (sheet.contains(e.target) || controls.contains(e.target)) return; cleanup(); res(); };
      const key = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); cleanup(); res(); } };
      function cleanup() { target.removeEventListener("click", go); seal.removeEventListener("keydown", key); }
      target.addEventListener("click", go);
      seal.addEventListener("keydown", key);
    });
  }

  function fill(d) {
    const p = PAPERS[d.paper];
    letter.style.setProperty("--paper-img", `url("img/paper${d.paper}.webp")`);
    letter.style.setProperty("--paper-ink", p.ink);
    seal.querySelectorAll("img").forEach(im => { im.src = `img/seal${d.wax}.webp`; });
    $("l-to").textContent = d.to + "：";
    $("l-from").textContent = d.from;
    $("l-stamp").src = `img/stamp${d.stamp}.webp`;
    $("l-stamp").alt = "邮票：" + STAMPS[d.stamp];
    $("l-parcel").innerHTML = PARCEL_SVG[d.parcel] || "";
    $("l-gift").hidden = !d.parcel;
    drawSticker($("l-doodle-cv"), d.draw);
    $("l-gift-note").textContent = d.parcel ? `随信附上${PARCELS[d.parcel]}\n${PARCEL_MEAN[d.parcel]}` : "";
    const now = new Date();
    const ds = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, "0")}.${String(now.getDate()).padStart(2, "0")}`;
    document.querySelectorAll(".pm-date").forEach(t => { t.textContent = ds; });
    $("env-stamp-img").src = `img/stamp${d.stamp}.webp`;
    $("env-to").textContent = "To：" + d.to;
    const body = $("l-body"); body.textContent = "";
    for (const ch of Array.from(d.body)) { const s = document.createElement("span"); s.textContent = ch; body.appendChild(s); }
  }

  async function play(d) {
    const my = ++run;
    const alive = () => my === run;
    fill(d);
    // reset
    for (const el of [mimi, env, letter, $("env-closed"), $("env-open"), $("l-doodle")]) { el.getAnimations().forEach(a => a.cancel()); }
    $("l-doodle").style.opacity = 0;
    env.classList.remove("open");
    mimi.classList.remove("bye"); $("keep").classList.remove("on"); $("bye-note").classList.remove("on"); $("save-mini").classList.remove("on");
    hint1.classList.remove("on", "off"); hint2.classList.remove("on"); controls.classList.remove("on"); pawOff();
    mimi.style.opacity = 0; env.style.opacity = 0; letter.style.opacity = 0;
    stopSprite();
    await ready;
    if (!alive()) return;
    if (!cache.bye) loadSet("bye");

    // 1. the world rushes past while Mimi rides in
    hint1.classList.add("on");
    target = 1; speed = 0.6;
    loop("ride", 80);
    await anim(mimi, [
      { opacity: 1, transform: "translate(-115%, 6%)" },
      { opacity: 1, transform: "translate(0, 0)" }
    ], { duration: 1700 });
    if (!alive()) return;
    await sleep(1100);
    if (!alive()) return;

    // 2. brake, hop off, take out the letter
    target = 0.035;
    await once("stop", 150);
    if (!alive()) return;
    hint1.classList.add("off");
    $("tip-img").src = "img/tip1.webp"; $("tip-img").alt = "点一下，收下这封信";
    hint2.classList.add("on");
    pawAt(39.5, 64.4);
    await waitTap(stage);
    pawOff();
    if (!alive()) return;
    hint2.classList.remove("on");

    // 3. envelope comes forward
    anim(mimi, [{ opacity: 1, transform: "translateY(0)" }, { opacity: 0, transform: "translateY(10%) scale(.96)" }], { duration: 600 });
    await anim(env, [{ opacity: 0, transform: "scale(.35) translateY(40%)" }, { opacity: 1, transform: "scale(1) translateY(0)" }], { duration: 750, easing: "cubic-bezier(.3,1.3,.5,1)" });
    if (!alive()) return;
    $("tip-img").src = "img/tip2.webp"; $("tip-img").alt = "点火漆，拆开它";
    hint2.classList.add("on");
    pawAt(50, 60.5);
    await waitTap(stage);
    pawOff();
    if (!alive()) return;
    hint2.classList.remove("on");

    // 4. open
    env.classList.add("open");
    await sleep(350);
    if (!alive()) return;
    await anim($("env-open"), [{ opacity: 0, transform: "translateY(3%)" }, { opacity: 1, transform: "translateY(0)" }], { duration: 420, easing: "ease-out" });
    anim($("env-closed"), [{ opacity: 1 }, { opacity: 0 }], { duration: 1 });
    await sleep(700);
    if (!alive()) return;
    anim(env, [{ opacity: 1, transform: "translateY(0)" }, { opacity: 0, transform: "translateY(55%) scale(.9)" }], { duration: 700 });
    await anim(letter, [{ opacity: 0, transform: "translateY(22%) scale(.55)" }, { opacity: 1, transform: "translateY(0) scale(1)" }], { duration: 800 });
    if (!alive()) return;

    // 5. words appear
    const spans = $("l-body").querySelectorAll("span");
    const per = reduce ? 0 : Math.max(22, Math.min(70, 4200 / Math.max(spans.length, 1)));
    for (const s of spans) { if (!alive()) return; s.classList.add("on"); if (per) await sleep(per); }
    await sleep(300);
    if (!alive()) return;
    if (d.draw) {
      await anim($("l-doodle"), [
        { opacity: 0, transform: "rotate(-30deg) scale(.2)" },
        { opacity: 1, transform: "rotate(-4deg) scale(1.18)", offset: .7 },
        { opacity: 1, transform: "rotate(-8deg) scale(1)" }
      ], { duration: 520, easing: "ease-out" });
      if (!alive()) return;
    }

    // 6. keep the letter: it folds into the envelope and is tucked away
    await sleep(500);
    if (!alive()) return;
    $("keep").classList.add("on");
    $("save-mini").classList.add("on");
    pawAt(91, 90);
    await waitTap($("keep"));
    pawOff();
    if (!alive()) return;
    $("keep").classList.remove("on");
    $("save-mini").classList.remove("on");
    for (const el of [env, $("env-closed"), $("env-open")]) el.getAnimations().forEach(a => a.cancel());
    $("env-open").style.opacity = 0; $("env-closed").style.opacity = 1;
    env.classList.remove("open");
    env.style.zIndex = 5;
    await anim(env, [{ opacity: 0, transform: "scale(.7)" }, { opacity: 1, transform: "scale(1)" }], { duration: 420, easing: "cubic-bezier(.3,1.4,.5,1)" });
    await anim(letter, [{ opacity: 1, transform: "none" }, { opacity: 1, transform: "translateY(26%) scale(.5)", offset: .6 }, { opacity: 0, transform: "translateY(40%) scale(.42)" }], { duration: 800, easing: "cubic-bezier(.5,0,.6,1)" });
    env.style.zIndex = "";
    if (!alive()) return;
    await sleep(700);
    if (!alive()) return;
    await anim(env, [{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateY(140%) scale(.35) rotate(-8deg)" }], { duration: 750, easing: "cubic-bezier(.5,0,.8,.5)" });
    if (!alive()) return;

    // 7. Mimi waves goodbye and rides off
    mimi.classList.add("bye");
    if (cache.bye) { show("bye", 0); await Promise.race([cache.bye[0].decode().catch(() => {}), sleep(1500)]); }
    if (!alive()) return;
    // big and close on the left, then away to the upper right, shrinking into the stars
    const flight = anim(mimi, [
      { opacity: 0, transform: "translate(-75%, 10%) scale(1.5)" },
      { opacity: 1, transform: "translate(-20%, 6%) scale(1.42)", offset: .07 },
      { opacity: 1, transform: "translate(-14%, 4%) scale(1.38)", offset: .58 },
      { opacity: 1, transform: "translate(4%, -8%) scale(.78)", offset: .74 },
      { opacity: 1, transform: "translate(14%, -18%) scale(.38)", offset: .88 },
      { opacity: 0, transform: "translate(20%, -25%) scale(.12)" }
    ], { duration: 6100, easing: "linear" });
    target = 0.035;
    await Promise.all([once("bye", 83), flight]);
    if (!alive()) return;
    $("bye-note").classList.add("on");
    await sleep(900);
    if (!alive()) return;
    controls.classList.add("on");
  }

  // ---------- composer ----------
  function opts(sel, map, fmt) { sel.innerHTML = Object.entries(map).map(([k, v]) => `<option value="${k}">${k} · ${fmt(v)}</option>`).join(""); }
  opts($("f-paper"), PAPERS, v => v.name);
  opts($("f-wax"), WAXES, v => v[0]);
  opts($("f-stamp"), STAMPS, v => v);
  opts($("f-parcel"), PARCELS, v => v);
  const PICS = {
    "f-paper": [PAPERS, (k, v) => [`<div class="pic paper"><img src="img/paper${k}.webp" alt=""></div>`, v.name]],
    "f-wax": [WAXES, (k, v) => [`<div class="pic"><img src="img/seal${k}.webp" alt="" style="width:78%"></div>`, v[0]]],
    "f-stamp": [STAMPS, (k, v) => [`<div class="pic stp"><img src="img/stamp${k}.webp" alt=""></div>`, v]],
    "f-parcel": [PARCELS, (k, v) => [`<div class="pic">${PARCEL_SVG[k] ? PARCEL_SVG[k].replace(/id="(\w+)"/g, 'id="c$1"').replace(/#(\w+)\)/g, "#c$1)") : '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="30" fill="none" stroke="currentColor" stroke-opacity=".4" stroke-width="3" stroke-dasharray="6 6"/></svg>'}</div>`, v]],
  };
  function syncChips() {
    document.querySelectorAll(".chips").forEach(box => {
      const v = $(box.dataset.for).value;
      box.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-checked", String(c.dataset.k === v)));
    });
  }
  document.querySelectorAll(".chips").forEach(box => {
    const id = box.dataset.for, [map, render] = PICS[id];
    box.innerHTML = Object.entries(map).map(([k, v]) => { const [pic, name] = render(k, v); const tip = id === "f-parcel" && PARCEL_MEAN[k] ? ` title="${PARCEL_MEAN[k]}"` : ""; return `<button type="button" class="chip" role="radio" data-k="${k}"${tip}>${pic}<span>${name}</span></button>`; }).join("");
    box.addEventListener("click", (e) => {
      const c = e.target.closest(".chip"); if (!c) return;
      $(id).value = c.dataset.k; syncChips(); $("marker").textContent = build(readForm());
    });
  });
  // ---------- pixel editor ----------
  const pixCv = $("pix"), pg = pixCv.getContext("2d");
  let grid = Array.from({ length: 16 }, () => Array(16).fill("0")), pen = "8", painting = false;
  function pixPaint() {
    pg.fillStyle = "#fffaf0"; pg.fillRect(0, 0, 160, 160);
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) if (grid[y][x] !== "0") { pg.fillStyle = PIX[grid[y][x]]; pg.fillRect(x * 10, y * 10, 10, 10); }
    pg.strokeStyle = "rgba(60,45,120,.12)"; pg.lineWidth = 1;
    for (let i = 1; i < 16; i++) { pg.beginPath(); pg.moveTo(i * 10 + .5, 0); pg.lineTo(i * 10 + .5, 160); pg.moveTo(0, i * 10 + .5); pg.lineTo(160, i * 10 + .5); pg.stroke(); }
  }
  function pixFrom(draw) { const rows = draw ? draw.split("/") : []; grid = Array.from({ length: 16 }, (_, y) => Array.from({ length: 16 }, (_, x) => (rows[y] && rows[y][x]) || "0")); pixPaint(); }
  function pixToDraw() { return normDraw(grid.map(r => r.join("")).join("/")); }
  function pixAt(e) {
    const r = pixCv.getBoundingClientRect(), x = Math.floor((e.clientX - r.left) / r.width * 16), y = Math.floor((e.clientY - r.top) / r.height * 16);
    if (x < 0 || y < 0 || x > 15 || y > 15) return;
    if (grid[y][x] !== pen) { grid[y][x] = pen; pixPaint(); $("marker").textContent = build(readForm()); }
  }
  pixCv.addEventListener("pointerdown", (e) => { painting = true; pixCv.setPointerCapture(e.pointerId); pixAt(e); });
  pixCv.addEventListener("pointermove", (e) => { if (painting) pixAt(e); });
  pixCv.addEventListener("pointerup", () => { painting = false; });
  $("palette").innerHTML = ["0", ...Object.keys(PIX)].map(k => `<button type="button" class="sw${k === "0" ? " erase" : ""}" role="radio" data-c="${k}" aria-label="${k === "0" ? "橡皮" : "颜色 " + k}" style="${k === "0" ? "" : "background:" + PIX[k]}"></button>`).join("");
  function syncPal() { $("palette").querySelectorAll(".sw").forEach(b => b.setAttribute("aria-checked", String(b.dataset.c === pen))); }
  $("palette").addEventListener("click", (e) => { const b = e.target.closest(".sw"); if (!b) return; pen = b.dataset.c; syncPal(); });
  $("pix-clear").addEventListener("click", () => { pixFrom(""); $("marker").textContent = build(readForm()); });
  syncPal(); pixPaint();
  function loadForm(d) {
    $("f-to").value = d.to; $("f-from").value = d.from; $("f-body").value = d.body;
    $("f-paper").value = d.paper; $("f-wax").value = d.wax; $("f-stamp").value = d.stamp; $("f-parcel").value = d.parcel;
    pixFrom(d.draw); count(); syncChips(); $("marker").textContent = build(d);
  }
  function readForm() {
    return { to: clean($("f-to").value, 20) || "你", from: clean($("f-from").value, 20) || "送信给你的我", body: clean($("f-body").value, 300),
      paper: +$("f-paper").value, wax: +$("f-wax").value, stamp: +$("f-stamp").value, parcel: +$("f-parcel").value, draw: pixToDraw() };
  }
  function count() { $("f-count").textContent = `${$("f-body").value.length} / 300 字　不能用 [ ] | 这三个符号`; }
  $("f-body").addEventListener("input", count);
  sheet.addEventListener("input", () => { $("marker").textContent = build(readForm()); });
  sheet.addEventListener("click", (e) => e.stopPropagation());
  sheet.addEventListener("submit", (e) => { e.preventDefault(); const d = readForm(); $("marker").textContent = build(d); sheet.classList.remove("on"); current = d; play(d); });
  $("close").addEventListener("click", () => sheet.classList.remove("on"));
  $("write").addEventListener("click", (e) => { e.stopPropagation(); loadForm(current); sheet.classList.add("on"); });
  $("again").addEventListener("click", (e) => { e.stopPropagation(); play(current); });

  // ---------- save the letter as one picture ----------
  const NOSTART2 = "，。、；：！？）」』”’》…—,.;:!?)";
  const loadImg = (src) => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
  const svgImg = (svg, color) => loadImg("data:image/svg+xml;charset=utf-8," + encodeURIComponent(
    svg.replace(/currentColor/g, color).replace(/<svg(?![^>]*xmlns)/, '<svg xmlns="http://www.w3.org/2000/svg"')));
  function wrapLines(g, text, maxW) {
    const lines = []; let cur = "";
    for (const ch of Array.from(text)) {
      if (cur && g.measureText(cur + ch).width > maxW) {
        if (NOSTART2.includes(ch)) { lines.push(cur.slice(0, -1)); cur = cur.slice(-1) + ch; } else { lines.push(cur); cur = ch; }
      } else cur += ch;
    }
    if (cur) lines.push(cur);
    return lines;
  }
  async function renderLetter(d) {
    const W = 1080, H = 1920, c = document.createElement("canvas"); c.width = W; c.height = H;
    const g = c.getContext("2d");
    const SERIF = '"ZCOOL XiaoWei", "Songti SC", "STSong", serif', SIGN = '"Ma Shan Zheng", "Kaiti SC", "STKaiti", cursive', UI = '"ZCOOL KuaiLe", "PingFang SC", sans-serif';
    try { await Promise.race([Promise.all([
      document.fonts.load('40px "ZCOOL XiaoWei"', d.body + "银河邮局米米投递随信附上" + (PARCELS[d.parcel] || "") + (PARCEL_MEAN[d.parcel] || "")),
      document.fonts.load('40px "Ma Shan Zheng"', d.to + d.from + "："),
      document.fonts.load('40px "ZCOOL KuaiLe"', "米米的银河邮局"),
    ]), sleep(2500)]); } catch (e) {}
    const [sky, paper, stamp, logo] = await Promise.all(["img/sky.webp", `img/paper${d.paper}.webp`, `img/stamp${d.stamp}.webp`, "img/logo.webp"].map(loadImg));
    const sc = Math.max(W / sky.width, H / sky.height);
    g.drawImage(sky, (W - sky.width * sc) / 2, (H - sky.height * sc) / 2, sky.width * sc, sky.height * sc);
    // paper
    const pw = 960, ph = pw * 1040 / 720, px = 60, py = 80, u = pw / 88;
    const ink = PAPERS[d.paper].ink;
    g.save(); g.shadowColor = "rgba(8,4,40,.55)"; g.shadowBlur = 50; g.shadowOffsetY = 24; g.drawImage(paper, px, py, pw, ph); g.restore();
    const L = px + 10 * u, R = px + pw - 10 * u, T = py + 11 * u, B = py + ph - 9 * u;
    // stamp with perforated edge
    const sw = 21 * u, st = document.createElement("canvas"); st.width = st.height = Math.round(sw);
    const sg = st.getContext("2d"); sg.fillStyle = "#fffaf0"; sg.fillRect(0, 0, sw, sw);
    sg.drawImage(stamp, 2.4 * u, 2.4 * u, sw - 4.8 * u, sw - 4.8 * u);
    sg.globalCompositeOperation = "destination-out"; const rr = 1.1 * u, step = 2.6 * u;
    for (let t = step / 2; t < sw; t += step) for (const [x, y] of [[t, 0], [t, sw], [0, t], [sw, t]]) { sg.beginPath(); sg.arc(x, y, rr, 0, 7); sg.fill(); }
    const sx = R - sw, sy = T;
    g.save(); g.translate(sx + sw / 2, sy + sw / 2); g.rotate(4 * Math.PI / 180); g.shadowColor = "rgba(0,0,0,.2)"; g.shadowBlur = 10; g.shadowOffsetY = 4;
    g.drawImage(st, -sw / 2, -sw / 2); g.restore();
    // cat-head postmark
    try {
      const pm = await svgImg(document.querySelector(".postmark").outerHTML, ink);
      const pmw = 28 * u, pmh = pmw * 80 / 120;
      g.save(); g.globalAlpha = .5; g.translate(sx - 17 * u + pmw / 2, T + 8 * u + pmh / 2); g.rotate(-14 * Math.PI / 180); g.drawImage(pm, -pmw / 2, -pmh / 2, pmw, pmh); g.restore();
    } catch (e) {}
    // to
    g.fillStyle = ink; g.textBaseline = "alphabetic";
    g.font = `${6.4 * u}px ${SIGN}`; g.fillText(d.to + "：", L, T + 7 * u + 6.4 * u);
    // foot
    const footTop = B - 30 * u;
    if (d.parcel && PARCEL_SVG[d.parcel]) {
      try { const pi = await svgImg(PARCEL_SVG[d.parcel], "#c9922a"); g.drawImage(pi, L + 5 * u, footTop, 20 * u, 20 * u); } catch (e) {}
      g.save(); g.globalAlpha = .72; g.font = `${2.9 * u}px ${SERIF}`; g.textAlign = "center";
      g.fillText(`随信附上${PARCELS[d.parcel]}`, L + 15 * u, footTop + 24.5 * u); g.fillText(PARCEL_MEAN[d.parcel], L + 15 * u, footTop + 28.7 * u); g.restore();
    }
    g.save(); g.textAlign = "right";
    g.font = `${6.4 * u}px ${SIGN}`; g.fillText(d.from, R, B);
    g.globalAlpha = .6; g.font = `${3.2 * u}px ${SERIF}`; g.fillText("银河邮局 · 米米投递", R, B - 8 * u); g.restore();
    // body, shrinking only if a long letter would run into the foot
    const top = T + 24.5 * u, maxH = footTop - 2.5 * u - top;
    let fs = 4.8 * u, lh = 7.4 * u, lines;
    for (;;) { g.font = `${fs}px ${SERIF}`; lines = wrapLines(g, d.body, R - L); if (lines.length * lh <= maxH || fs < 2.6 * u) break; fs *= .94; lh *= .94; }
    lines.forEach((ln, i) => g.fillText(ln, L, top + i * lh + fs));
    // doodle sticker
    if (d.draw) {
      const dw = 18 * u, dx = px + pw - 9 * u - dw, dy = py + ph - 27 * u - dw;
      g.save(); g.translate(dx + dw / 2, dy + dw / 2); g.rotate(-8 * Math.PI / 180); g.shadowColor = "rgba(40,20,60,.28)"; g.shadowBlur = 8; g.shadowOffsetY = 5;
      g.imageSmoothingEnabled = false; g.drawImage($("l-doodle-cv"), -dw / 2, -dw / 2, dw, dw); g.restore();
    }
    // footer: the post office sign and where to send one back
    const lw = 560, lh2 = lw * logo.height / logo.width;
    g.drawImage(logo, (W - lw) / 2, py + ph + 70, lw, lh2);
    g.save(); g.textAlign = "center"; g.fillStyle = "#fff6df"; g.globalAlpha = .7; g.font = `30px ${UI}`;
    g.fillText("byebyealice.github.io/mimi-letter", W / 2, py + ph + 70 + lh2 + 60); g.restore();
    return c;
  }
  let savedBlob = null, savedUrl = "";
  async function openSave(e) {
    if (e) e.stopPropagation();
    const box = $("saved"); box.hidden = false;
    $("saved-spin").hidden = false; $("saved-img").hidden = true; $("saved-tip").hidden = true; $("saved-dl").hidden = true;
    try {
      const c = await renderLetter(current);
      savedBlob = await new Promise(r => c.toBlob(r, "image/png"));
      if (savedUrl) URL.revokeObjectURL(savedUrl);
      savedUrl = URL.createObjectURL(savedBlob);
      $("saved-img").src = savedUrl; $("saved-img").hidden = false; $("saved-tip").hidden = false; $("saved-dl").hidden = false; $("saved-spin").hidden = true;
    } catch (err) { $("saved-spin").textContent = "这封信没拍成照片，再试一次吧"; }
  }
  $("save").addEventListener("click", openSave);
  $("save-mini").addEventListener("click", openSave);
  $("saved").addEventListener("click", (e) => e.stopPropagation());
  $("saved-close").addEventListener("click", () => { $("saved").hidden = true; $("saved-spin").textContent = "米米正在把信拍成照片……"; });
  $("saved-dl").addEventListener("click", async () => {
    if (!savedBlob) return;
    const name = `米米的信_${current.to}.png`;
    try {
      const f = new File([savedBlob], name, { type: "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: "米米的信" }); return; }
    } catch (err) { if (err && err.name === "AbortError") return; }
    const a = document.createElement("a"); a.href = savedUrl; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  });

  let current = parse(location.hash) || parse(DEMO);
  addEventListener("hashchange", () => { const d = parse(location.hash); if (d) { current = d; play(d); } });
  window.mimiLetter = { parse, build, play: (m) => { const d = parse(m); if (d) { current = d; play(d); } } };
  play(current);
})();
